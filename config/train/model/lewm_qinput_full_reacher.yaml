# q-only-input LeWM, NATIVE-FULL q (reacher, 6-d); projector / predictor / action encoder are
# byte-identical to model/lewm.yaml so the arm isolates the input modality alone.
_target_: qjepa.QJEPA
q_dim: 6
q_stats_file: reacher.lance.q_stats.reacher_joints_plus_finger.json

encoder:
  _target_: module.MLP
  input_dim: 6
  hidden_dim: 2048
  output_dim: ${embed_dim}

predictor:
  _target_: module.ARPredictor
  num_frames: ${history_size}
  input_dim: ${embed_dim}
  hidden_dim: ${embed_dim}
  output_dim: ${embed_dim}
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

action_encoder:
  _target_: module.Embedder
  input_dim: ???
  emb_dim: ${embed_dim}

projector:
  _target_: module.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true

pred_proj:
  _target_: module.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true
