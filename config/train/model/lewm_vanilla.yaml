# C2 variant: no encoder-side projector — z is the ViT CLS token after the
# backbone's native final LayerNorm (D=192). The predictor-side MLP+BN projector
# is replaced by a plain LayerNorm so predictions live on the same LN shell as
# their targets. Never combine this model with SIGReg (see validate_config).
_target_: jepa.JEPA

encoder:
  _target_: stable_pretraining.backbone.utils.vit_hf
  size: tiny
  patch_size: 14
  image_size: ${img_size}
  pretrained: false
  use_mask_token: false

predictor:
  _target_: module.ARPredictor
  num_frames: ${history_size}
  input_dim: ${embed_dim}
  hidden_dim: ${embed_dim}
  output_dim: ${embed_dim}
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

action_encoder:
  _target_: module.Embedder
  input_dim: ???
  emb_dim: ${embed_dim}

projector: null

pred_proj:
  _target_: torch.nn.LayerNorm
  normalized_shape: ${embed_dim}
