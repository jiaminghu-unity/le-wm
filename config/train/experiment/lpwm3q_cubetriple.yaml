# @package _global_
# LpWM reg-weight ablation (user request 2026-09-07): identical to the official
# OGBench recipe EXCEPT RDMReg weight 10.0 -> 0.1 (single-variable ablation:
# is the paper's lambda=10 over-regularizing at our capability level?).
defaults:
  - override /data: ogb_triple

output_model_name: lewm_lpwm3q_cubetriple_s${seed}
subdir: ${output_model_name}

model:
  rep_relu: true

trainer:
  max_epochs: 10
  devices: 1

loss:
  sigreg:
    type: rdmreg
    weight: 0.1
    kwargs:
      num_proj: 1024
      mu: 0.0
      b: 0.7071067811865476
      rms_norm: true
  temporal_jaccard:
    weight: 0.1
  obj:
    weight: 0.1
    q_variant: cube_triple_full
  aux:
    weight: 0.0
