# @package _global_
# C2: L_obj with no projector — z = LN'd ViT CLS; predictor output gets a plain
# LayerNorm (see model/lewm_vanilla.yaml). loss.obj.weight fixed from the C2p sweep.
defaults:
  - override /model: lewm_vanilla

output_model_name: lewm_c2_obj${loss.obj.weight}_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

loss:
  sigreg:
    weight: 0.0
  obj:
    weight: 0.1
