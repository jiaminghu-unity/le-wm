# @package _global_
# q-only-input LeWM with the COMPLETE Reacher state (8-d reacher_native_full: joints cos/sin +
# fingertip xy + joint velocities; q_reacher_full.py). Rebuttal R3W6 state-based world model.
# Trained via train_qnative.py (runtime variant registration).
defaults:
  - override /data: dmc
  - override /model: lewm_qinput_native_reacher

output_model_name: lewm_qinput_native_reacher_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

data:
  dataset:
    name: reacher.lance
    keys_to_load:
      - pixels
      - action
      - observation
      - qpos
      - finger_pos
      - qvel
    keys_to_cache:
      - action
      - observation
      - qpos
      - finger_pos
      - qvel

loss:
  obj:
    weight: 0.0
    q_variant: reacher_native_full
