# @package _global_
# K7: dose point for K2 — lambda_obj 0.1 -> 0.2, everything else identical.
defaults:
  - override /data: ogb_cube

output_model_name: lewm_k7_cube_obj_eff${loss.obj.weight}_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

loss:
  obj:
    weight: 0.2
    q_variant: cube_effector
  aux:
    weight: 0.0
