# @package _global_
# cubequadruple: Aux (SIGReg + q-regression head 0.1 on FULL-CONFIG q). Mirrors cubedouble_aux.yaml.
defaults:
  - override /data: ogb_quadruple

output_model_name: lewm_cubequadruple_aux0.1_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

loss:
  obj:
    weight: 0.0
    q_variant: cube_quadruple_full
  aux:
    weight: 0.1
