# @package _global_
# R5: aux q-regression head on Reacher (information-injection control, joints q).
# Mirrors r2_reacher_paep's data setup with loss.aux instead of loss.obj.
defaults:
  - override /data: dmc

output_model_name: lewm_r5_qhead${loss.aux.weight}_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

data:
  dataset:
    name: reacher.lance
    keys_to_load:
      - pixels
      - action
      - observation
      - qpos
      - finger_pos
    keys_to_cache:
      - action
      - observation
      - qpos
      - finger_pos

loss:
  obj:
    weight: 0.0
    q_variant: reacher_joints_only
  aux:
    weight: 0.2
