# @package _global_
# q-only-input LeWM (cube_quadruple, FULL-CONFIG 37-d q: arm 17 + block 5 x 4).
# Trained via train_qnative.py (q_ogb_multi variants registered at runtime).
defaults:
  - override /data: ogb_quadruple
  - override /model: lewm_qinput_cubequadruple

output_model_name: lewm_qinput_cubequadruple_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

loss:
  obj:
    weight: 0.0
    q_variant: cube_quadruple_full
