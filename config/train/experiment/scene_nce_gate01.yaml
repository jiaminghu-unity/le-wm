# @package _global_
# GATED full-q SCALE: L_obj on sqrt(g*) x q with the lambda=0.5 Stage-1 gate
# (train_qgate2.py, QGATE_GCS injected by the chain). Derived from scene_obj.yaml.
defaults:
  - override /data: ogb_scene

output_model_name: lewm_scene_nce_gate01_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

loss:
  obj:
    weight: 0.1
    q_variant: scene_full
