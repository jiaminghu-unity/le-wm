# @package _global_
# Rebuttal (2026-11-11): LpWM baseline on cube, with the SCALE paper's task state q and data
# config (derived from k1_cube_baseline.yaml). LpWM = RDMReg + RepReLU on both heads under the LeWM
# architecture and 10-epoch recipe. official OGBench-Cube recipe (reg weight 10, rms_norm on, TemporalJaccard 0.1).
# SCALE weight 0.0 (the paper arm's value for this task). Generated, not hand-edited.
defaults:
- override /data: ogb_cube
output_model_name: lewm_lpwmr_cube_base_s${seed}
subdir: ${output_model_name}
trainer:
  max_epochs: 10
  devices: 1
loss:
  obj:
    weight: 0.0
    q_variant: cube_effector
  aux:
    weight: 0.0
  sigreg:
    type: rdmreg
    weight: 10.0
    kwargs:
      num_proj: 1024
      mu: 0.0
      b: 0.7071067811865476
      rms_norm: true
  temporal_jaccard:
    weight: 0.1
model:
  rep_relu: true
