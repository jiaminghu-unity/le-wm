# @package _global_
# R1: vanilla LeWM on Reacher (repo dmc defaults; paper setting: 10 epochs).
# qpos/finger_pos ride along in the batch for pipeline parity but no loss uses them.
defaults:
  - override /data: dmc

output_model_name: lewm_r1_reacher_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

data:
  dataset:
    name: reacher.lance
    keys_to_load:
      - pixels
      - action
      - observation
      - qpos
      - finger_pos
    keys_to_cache:
      - action
      - observation
      - qpos
      - finger_pos

loss:
  obj:
    weight: 0.0
    q_variant: reacher_joints_only
