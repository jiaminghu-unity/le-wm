# @package _global_
# q-only-input LeWM with NATIVE-FULL q (Push-T, 8-d incl. velocities).
# Trained via train_qnative.py (runtime variant registration).
defaults:
  - override /model: lewm_qinput_full_pusht

output_model_name: lewm_qinput_full_pusht_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

loss:
  obj:
    weight: 0.0
    q_variant: pusht_state_native
