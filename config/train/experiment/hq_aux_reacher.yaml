# @package _global_
# HQ (reduced-q) ablation, arm aux on Reacher.
#
# Identical to lewm_r5_qhead0.4_s3072 (obj weight 0.0, aux weight 0.4, SIGReg at the repo
# default, 10 epochs, same lance dataset) except that q is reacher_joint0_only
# (2-dim: cos/sin of joint 0) instead of reacher_joints_only (4-dim). The elbow
# joint is withheld -- and with it the finger position it determines.
defaults:
  - override /data: dmc

output_model_name: lewm_hq_aux_reacher_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

data:
  dataset:
    name: reacher.lance
    keys_to_load:
      - pixels
      - action
      - observation
      - qpos
      - finger_pos
    keys_to_cache:
      - action
      - observation
      - qpos
      - finger_pos

loss:
  obj:
    weight: 0.0
    q_variant: reacher_joint0_only
  aux:
    weight: 0.4
