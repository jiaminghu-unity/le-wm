# @package _global_
# puzzle_3x3: LeWM baseline (pixels, SIGReg 0.09). Data: self-collected OGB multi-object.
defaults:
  - override /data: ogb_puzzle

output_model_name: lewm_puzzle_base_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

loss:
  obj:
    weight: 0.0
    q_variant: puzzle_3x3_full
