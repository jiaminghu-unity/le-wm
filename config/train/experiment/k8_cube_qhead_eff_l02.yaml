# @package _global_
# K8: dose point for K4 — lambda_aux 0.1 -> 0.2, everything else identical.
defaults:
  - override /data: ogb_cube

output_model_name: lewm_k8_cube_qhead_eff${loss.aux.weight}_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

loss:
  obj:
    weight: 0.0
    q_variant: cube_effector
  aux:
    weight: 0.2
