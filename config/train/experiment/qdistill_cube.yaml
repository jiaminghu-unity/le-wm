# @package _global_
# Metric-distilled SCALE (Cube): pixel training, SIGReg + L_obj 0.1 aligned to the
# frozen cube q-only teacher's geometry. Paired against lewm_k2_cube_obj_eff0.1.
defaults:
  - override /data: ogb_cube

output_model_name: lewm_qdistill_cube0.1_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

loss:
  obj:
    weight: 0.1
    q_variant: cube_effector
