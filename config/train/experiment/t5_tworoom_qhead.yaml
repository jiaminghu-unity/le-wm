# @package _global_
# T5: two-room aux q-head — information-injection control for T2. Same 2-d q, injected by
# an auxiliary MLP head regressing q from the embedding (supervises DECODABILITY, not
# distance geometry). The head lives outside JEPA and is discarded at eval.
#
# weight = 0.1, DECLARED UNTUNED. Unlike lambda_obj, the aux weight is not consistent
# across the existing tasks (Push-T 0.3, Reacher 0.4, Cube 0.1), so no value carries over
# cleanly; 0.1 is c5_qhead.yaml's config default and was fixed before any two-room result
# existed. If this arm underperforms, that is a plausible reason and will be reported as
# such rather than as "aux does not work on two-room".
defaults:
  - override /data: tworoom_q

output_model_name: lewm_t5_tworoom_qhead${loss.aux.weight}_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

loss:
  obj:
    weight: 0.0
    q_variant: tworoom_agent   # selects the q the aux head regresses (2-dim)
  aux:
    weight: 0.1
