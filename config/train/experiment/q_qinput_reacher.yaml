# @package _global_
# q-only-input LeWM teacher (Reacher): MLP encoder over the 4-d joints cos/sin q,
# SIGReg 0.09, no L_obj/aux. Trained as the metric-distillation teacher.
defaults:
  - override /data: dmc
  - override /model: lewm_qinput_reacher

output_model_name: lewm_qinput_reacher_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

data:
  dataset:
    name: reacher.lance
    keys_to_load:
      - pixels
      - action
      - observation
      - qpos
      - finger_pos
    keys_to_cache:
      - action
      - observation
      - qpos
      - finger_pos

loss:
  obj:
    weight: 0.0
    q_variant: reacher_joints_only
