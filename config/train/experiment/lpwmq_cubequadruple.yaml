# @package _global_
# LpWM arm (RDMReg mu=-1 b=1/sqrt2 + RepReLU), unchanged LeWM recipe.
defaults:
  - override /data: ogb_quadruple

output_model_name: lewm_lpwmq_cubequadruple_s${seed}
subdir: ${output_model_name}

model:
  rep_relu: true

trainer:
  max_epochs: 10
  devices: 1

loss:
  sigreg:
    type: rdmreg
    kwargs:
      num_proj: 1024
      mu: -1.0
      b: 0.7071067811865476
  obj:
    weight: 0.1
    q_variant: cube_quadruple_full
  aux:
    weight: 0.0
