# @package _global_
# Rebuttal (2026-11-11): LpWM baseline on pusht, with the SCALE paper's task state q and data
# config (derived from c1_baseline.yaml). LpWM = RDMReg + RepReLU on both heads under the LeWM
# architecture and 10-epoch recipe. official Push-T recipe (reg weight 0.5, rms_norm off, TemporalJaccard off).
# SCALE weight 0.0 (the paper arm's value for this task). Generated, not hand-edited.
output_model_name: lewm_lpwmr_pusht_base_s${seed}
subdir: ${output_model_name}
trainer:
  max_epochs: 10
  devices: 1
model:
  rep_relu: true
loss:
  sigreg:
    type: rdmreg
    weight: 0.5
    kwargs:
      num_proj: 1024
      mu: 0.0
      b: 0.7071067811865476
      rms_norm: false
  temporal_jaccard:
    weight: 0.0
  obj:
    weight: 0.0
  aux:
    weight: 0.0
