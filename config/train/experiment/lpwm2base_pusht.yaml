# @package _global_
# LpWM OFFICIAL recipe (lpwm_swm/config/lpwm.yaml): RDMReg weight 10.0, mu=0,
# sigma=1/sqrt2, rms-normalized rectified target, RepReLU both heads;
# PushT: reg weight 0.5 = the paper Deep-AdaLN cell (reproduce_pusht.sh);
# rms_norm off to match the main-repo PushT recipe; TemporalJaccard off.
output_model_name: lewm_lpwm2base_pusht_s${seed}
subdir: ${output_model_name}

model:
  rep_relu: true

trainer:
  max_epochs: 10
  devices: 1

loss:
  sigreg:
    type: rdmreg
    weight: 0.5
    kwargs:
      num_proj: 1024
      mu: 0.0
      b: 0.7071067811865476
      rms_norm: false
  temporal_jaccard:
    weight: 0.0
  obj:
    weight: 0.0
    q_variant: pusht_state_native
  aux:
    weight: 0.0
