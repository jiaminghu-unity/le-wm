# @package _global_
# cubedouble: LeWM baseline (pixels, SIGReg 0.09). Data: self-collected OGB multi-object.
defaults:
  - override /data: ogb_double

output_model_name: lewm_cubedouble_base_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

loss:
  obj:
    weight: 0.0
    q_variant: cube_double_full
