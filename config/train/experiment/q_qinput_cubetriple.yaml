# @package _global_
# q-only-input LeWM (cube_triple, FULL-CONFIG 32-d q: arm 17 + block 5 x 3).
# Trained via train_qnative.py (q_ogb_multi variants registered at runtime).
defaults:
  - override /data: ogb_triple
  - override /model: lewm_qinput_cubetriple

output_model_name: lewm_qinput_cubetriple_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

loss:
  obj:
    weight: 0.0
    q_variant: cube_triple_full
