# @package _global_
# scene: LeWM baseline (pixels, SIGReg 0.09). Data: self-collected OGB multi-object.
defaults:
  - override /data: ogb_scene

output_model_name: lewm_scene_base_s${seed}
subdir: ${output_model_name}

trainer:
  max_epochs: 10
  devices: 1

loss:
  obj:
    weight: 0.0
    q_variant: scene_full
