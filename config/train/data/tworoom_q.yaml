# two-room with the physical-state column L_obj / the aux head need.
# Identical to tworoom.yaml plus pos_agent (the q source), and lance instead of h5 --
# every two-room arm uses this file, INCLUDING the baseline, so the dataloader is
# byte-identical across arms and any difference between them comes from the loss alone
# (same convention as ogb_cube.yaml and r1_reacher_baseline).
#
# pos_agent and proprio hold the same 2-d agent position (the schema probe found their
# ranges identical); q is built from pos_agent, and proprio rides along because the
# evaluation protocol sets the env state from it.
dataset:
  name: tworoom.lance
  num_steps: ${eval:'${num_preds} + ${history_size}'}
  frameskip: 5
  keys_to_load:
    - pixels
    - action
    - proprio
    - pos_agent
  keys_to_cache:
    - action
    - proprio
    - pos_agent
